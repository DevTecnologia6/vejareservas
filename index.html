<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://www.gstatic.com https://viacep.com.br; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0c08">
  <title>Datas disponíveis · Espaço Veja</title>
  <meta name="description" content="Consulte as datas disponíveis do Espaço Veja e reserve pelo WhatsApp.">
  <meta property="og:title" content="Espaço Veja · Datas disponíveis">
  <meta property="og:description" content="Veja os dias livres e reserve pelo WhatsApp.">
  <meta property="og:image" content="assets/banner.jpg">
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: var(--creme); }
    .pub-topo { position: relative; height: 230px; background: #0f0c08 url('assets/banner.jpg') center/cover; display: flex; align-items: flex-end; justify-content: center; }
    .pub-topo::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,12,8,.25) 0%, rgba(15,12,8,.9) 100%); }
    .pub-topo .marca { position: relative; text-align: center; padding-bottom: 22px; }
    .pub-topo h1 { font-family: 'Cormorant Garamond', serif; color: var(--ouro-claro); font-size: 40px; line-height: 1; margin-top: 10px; }
    .pub-topo p { color: #fff; letter-spacing: 4px; font-size: 11px; text-transform: uppercase; margin-top: 6px; }
    .pub-wrap { max-width: 560px; margin: -10px auto 0; padding: 0 14px 40px; position: relative; }
    .pub-wrap .card { padding: 22px 18px; }
    .pub-dica { text-align: center; color: var(--cinza); font-size: 14px; margin: 4px 0 14px; }
    .pub-sel { margin-top: 16px; text-align: center; min-height: 90px; }
    .pub-sel b { display: block; font-size: 17px; margin-bottom: 10px; }
    .pub-rodape { text-align: center; color: var(--cinza); font-size: 12px; margin-top: 18px; }
    .cal-livre:not(.cal-passado) { border-color: #d9e9dd; }
    .cal-dia.sel { background: var(--grad); color: #fff; border-color: transparent; }
    .pub-sel .btn { margin-top: 2px; }
    #tela-acesso { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 14px; background: linear-gradient(180deg, rgba(15,12,8,.55), rgba(15,12,8,.92)), #0f0c08 url('assets/banner.jpg') center/cover fixed; }
    .acesso-card { width: 100%; max-width: 430px; background: var(--branco); border-radius: 22px; padding: 30px 24px 22px; box-shadow: 0 20px 60px rgba(0,0,0,.4); text-align: center; }
    .acesso-marca { font-family: 'Cormorant Garamond', serif; font-size: 34px; margin-top: 12px; line-height: 1; }
    .sub-ouro { color: var(--ouro); font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; margin: 6px 0 20px; }
    .acesso-titulo { font-size: 20px; margin-bottom: 4px; }
    .acesso-sub { color: var(--cinza); font-size: 14px; margin-bottom: 14px; }
    #acesso-corpo .chips { justify-content: center; }
    #acesso-corpo form { text-align: left; }
    .pub-conta { position: absolute; top: 12px; right: 12px; z-index: 2; display: flex; align-items: center; gap: 8px; color: #fff; font-size: 13px; flex-wrap: wrap; justify-content: flex-end; }
    .pub-conta .btn-claro { background: rgba(255,255,255,.95); }
    .pub-conta .btn-link { color: #fff; }
  </style>
</head>
<body>
  <!-- ============ ACESSO OBRIGATÓRIO ============ -->
  <section id="tela-acesso">
    <div class="acesso-card">
      <img src="assets/logo.png" class="logo-img" style="width:84px;height:84px" alt="Espaço Veja">
      <div class="acesso-marca">Espaço Veja</div>
      <p class="sub-ouro">Conforto &amp; Lazer · Reservas</p>
      <div id="acesso-corpo"><div class="vazio">Carregando…</div></div>
      <div id="selo-acesso" style="margin-top:18px"></div>
    </div>
  </section>

  <!-- ============ ÁREA DO CLIENTE ============ -->
  <div id="app-cliente" class="oculto">
  <header class="pub-topo">
    <div class="pub-conta" id="conta"></div>
    <div class="marca">
      <img src="assets/logo.png" class="logo-img" style="width:78px;height:78px;border:2px solid var(--ouro-claro)" alt="">
      <h1 id="pub-nome">Espaço Veja</h1>
      <p>Conforto &amp; Lazer</p>
    </div>
  </header>

  <div class="pub-wrap">
    <div class="card oculto" id="card-fotos" style="margin-bottom:14px;padding:16px">
      <div class="card-topo" style="margin-bottom:10px"><h3>📷 Conheça o espaço</h3><button class="btn-link" id="ver-fotos">Ver todas</button></div>
      <div class="galeria" id="galeria"></div>
    </div>
    <div class="card">
      <div class="card-topo" style="justify-content:center;gap:14px;flex-wrap:nowrap">
        <button class="btn-icone" id="ant" aria-label="Mês anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg></button>
        <h3 id="mes" style="min-width:190px;text-align:center"></h3>
        <button class="btn-icone" id="prox" aria-label="Próximo mês"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <p class="pub-dica">Toque em um dia livre para pedir a reserva pelo WhatsApp.</p>
      <div class="cal-legenda" style="justify-content:center"><span><i></i>Disponível</span><span><i class="res"></i>Reservado</span><span><i class="pen"></i>Em negociação</span></div>
      <div id="cal"><div class="vazio">Carregando datas…</div></div>
      <div class="pub-sel" id="sel"></div>
    </div>
    <div id="selo" style="margin-top:16px"></div>
    <p class="pub-rodape">Disponibilidade atualizada automaticamente · VejaReservas</p>
  </div>
  </div>

  <div id="modal-raiz"></div>
  <script src="js/vendor/qrcode.js"></script>
  <script type="module" src="js/publico.js"></script>
</body>
</html>
