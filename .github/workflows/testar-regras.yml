name: Testar regras
on: workflow_dispatch
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm i -g firebase-tools && npm i --no-save @firebase/rules-unit-testing firebase
      - run: firebase emulators:exec --only firestore --project demo-veja "node testes/regras.test.mjs"
