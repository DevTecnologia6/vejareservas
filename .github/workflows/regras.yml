name: Publicar regras do Firestore

on:
  push:
    branches: [main]
    paths: ['firestore.rules']
  workflow_dispatch:

jobs:
  regras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix lembrete --no-audit --no-fund
      - run: node lembrete/regras.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
